<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Per-route SEO block (title, description, keywords, robots, canonical, hreflang, Open Graph, Twitter, JSON-LD).
         Generated from src/config/seoConfig.ts by seo/vitePluginSeo.ts; one copy is emitted per route at build time. -->
    <!-- seo:start -->
    <!-- seo:end -->

    <!-- Site-wide meta -->
    <meta name="application-name" content="DSR Civil Constructions" />
    <meta name="author" content="DSR Civil Constructions" />
    <meta name="publisher" content="DSR Civil Constructions" />
    <meta name="copyright" content="DSR Civil Constructions" />
    <meta name="language" content="English" />
    <meta name="rating" content="general" />
    <meta name="format-detection" content="telephone=yes" />
    <meta name="theme-color" content="#001858" />
    <meta name="color-scheme" content="light" />

    <!-- Local / geo signals (Tamil Nadu, India) -->
    <meta name="geo.region" content="IN-TN" />
    <meta name="geo.placename" content="Tamil Nadu" />
    <meta name="geo.country" content="IN" />

    <!-- Open Graph / Twitter (static parts) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DSR Civil Constructions" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Mobile web app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DSR Civil" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Icons, manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- Performance: connections -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts: Barlow Condensed (Semibold/Bold) + Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Search Console / Bing verification: paste the token from each console, then uncomment.
    <meta name="google-site-verification" content="YOUR_GOOGLE_TOKEN" />
    <meta name="msvalidate.01" content="YOUR_BING_TOKEN" />
    -->
  </head>
  <body class="bg-dsr-white text-dsr-navy font-sans antialiased selection:bg-dsr-gold selection:text-dsr-navy min-h-screen">
    <noscript>
      <p style="padding:1rem;font-family:sans-serif">
        DSR Civil Constructions: residential, commercial and turnkey civil construction across Tamil Nadu.
        Call +91 73732 12354 or +91 90803 46867. Please enable JavaScript to view the full website.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
